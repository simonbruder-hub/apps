name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Supabase-Verbindung der veröffentlichten Apps (heute nur Taktwerk). Der Publishable key ist absichtlich
    # öffentlich, die Daten schützt Row-Level-Security (siehe taktwerk/supabase/README.md). GitHub-Variablen
    # mit denselben Namen haben Vorrang.
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://xlbddpaxwjgseqxaicuf.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_HawYMwgitp0Jo9CmA31oIA_tA3Hd-ik' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - name: App-Liste prüfen (apps.json)
        run: node scripts/apps.mjs pruefen
      - name: Apps bauen (alle mit website true aus apps.json)
        run: |
          for app in $(node scripts/apps.mjs website); do
            echo "::group::$app"
            (cd "$app" && npm ci && npm run build)
            echo "::endgroup::"
          done
      - name: Taktwerk als Einzeldatei
        working-directory: taktwerk
        run: npm run build:single
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html _site/
          # Gemeinsame Basis (Schriften, Farben) der Startseite und Bilder für Apps aus anderen Repos
          cp -r gemeinsam img _site/
          # Jede App: Weiterleitung und Infoseite aus site/, die App selbst unter app/
          for app in $(node scripts/apps.mjs website); do
            mkdir -p "_site/$app"
            cp -r "$app/site/." "_site/$app/"
            cp -r "$app/dist/app" "_site/$app/app"
          done
          cp taktwerk/dist/single/index.html _site/taktwerk/taktwerk.html
          # Frühere Adresse (/pomodoro-planer/v2/) leitet auf die App weiter
          cp -r .github/pages-legacy/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
